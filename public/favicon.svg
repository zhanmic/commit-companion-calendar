<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="My Swim Day">
  <!--
    Creative Fabrica–style leaping dolphin in a wave circle.
    PNG favicons carry the fuller mark; this SVG is the crisp fallback.
  -->

  <!-- Open cyan wave ring + splash -->
  <path
    fill="none"
    stroke="#40B4D1"
    stroke-width="6"
    stroke-linecap="round"
    d="M18 16
       C10 22 8 34 14 44
       C20 54 34 60 46 54
       C54 50 58 40 56 30"
  />
  <g fill="#40B4D1">
    <ellipse cx="12" cy="20" rx="2.2" ry="3" transform="rotate(-20 12 20)"/>
    <ellipse cx="8.5" cy="27" rx="1.7" ry="2.4" transform="rotate(-15 8.5 27)"/>
    <ellipse cx="14.5" cy="14.5" rx="1.4" ry="2" transform="rotate(-30 14.5 14.5)"/>
  </g>

  <!-- Dolphin leaping up-right through the ring -->
  <g transform="translate(34 33) rotate(28) translate(-34 -33)">
    <ellipse cx="34" cy="33" rx="14" ry="6.4" fill="#0b6e7a"/>
    <!-- beak -->
    <path fill="#0b6e7a" d="M46.5 31.5c3.2.4 5.8 1.6 7 2.6.8.6.4 1.8-.6 1.9-2.4.2-5.2 0-7.2-.6-1.2-.4-1.8-1.6-1.4-2.7.2-.7.9-1.3 2.2-1.2z"/>
    <!-- dorsal -->
    <path fill="#0b6e7a" d="M31 26.5c1.4-4.8 4.4-7.4 7.8-8.2.8-.2 1.4.8.9 1.5-1.6 2.4-2.4 4.8-2.6 7.2-2 .3-4 .6-6 .6-.4 0-.6-.4-.4-.8z"/>
    <!-- pectoral -->
    <path fill="#0b6e7a" d="M30.5 37c1.6 2.4 2.2 4.6 1.8 6.2-.2.6-1 .7-1.3.2-1.2-2-2.6-3.6-4.2-5-.4-.4-.2-1.1.4-1.2 1-.2 2.2-.2 3.3-.2z"/>
    <!-- fluke -->
    <path fill="#0b6e7a" d="M21.5 30c-3-.8-6-.6-8.6.6-.6.3-.5 1.2.2 1.3 2.2.4 4 .8 5.8 1.8-2.4 1-5 1.2-7.4.5-.6-.2-1.1.6-.6 1.1 2.8 2 6.6 2.6 10.2 1.4 1.2-.4 1.7-1.7 1.3-2.8-.2-.7-.7-1.4-1.7-1.9z"/>
    <circle cx="42.5" cy="32.2" r="1.4" fill="#f4f7f8"/>
  </g>
</svg>
