<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="My Swim Day">
  <!--
    Creative Fabrica–style mark (simplified for favicon):
    dark teal dolphin leaping up-left through an open cyan wave circle.
  -->

  <!-- Wave circle (open at top-left where the dolphin exits) -->
  <path
    fill="none"
    stroke="#40B4D1"
    stroke-width="6.5"
    stroke-linecap="round"
    d="M40 13.5
       C51 17 58 28 55.5 40
       C52.5 53 39.5 60 26.5 56.5
       C16.5 53.5 10 44 10.5 34"
  />

  <!-- Splash drops -->
  <g fill="#40B4D1">
    <ellipse cx="7.5" cy="40" rx="2.4" ry="3.2" transform="rotate(-25 7.5 40)"/>
    <ellipse cx="5" cy="33.5" rx="1.7" ry="2.3" transform="rotate(-30 5 33.5)"/>
    <ellipse cx="12" cy="45.5" rx="1.4" ry="1.9" transform="rotate(-20 12 45.5)"/>
  </g>

  <!-- Dolphin (rotated group so the silhouette faces up-left) -->
  <g transform="translate(32 34) rotate(-38) translate(-32 -34)">
    <!-- Body -->
    <ellipse cx="33" cy="34" rx="15.5" ry="7.2" fill="#0b6e7a"/>
    <!-- Head / beak (shorter, thicker — more dolphin than needle) -->
    <path fill="#0b6e7a" d="M18.2 32.8c-2.4.2-5.2 1.2-6.8 2.2-1 .6-.6 2 .5 2.2 2.2.4 4.8.6 6.8.2 1.4-.3 2.2-1.6 1.9-2.9-.2-.8-.9-1.7-2.4-1.7z"/>
    <!-- Dorsal fin -->
    <path fill="#0b6e7a" d="M29.5 26.8c2-5.4 5.6-8.2 9.4-8.8.9-.1 1.4 1 .8 1.7-2 2.5-3 5.2-3.2 8-2.4.2-4.6.5-6.8.6-.5 0-.7-.5-.5-1 .1-.2.2-.4.3-.5z"/>
    <!-- Pectoral fin -->
    <path fill="#0b6e7a" d="M29 38.8c1.8 2.6 2.6 5 2.2 6.6-.2.7-1.1.8-1.4.2-1.4-2.2-3-4-4.6-5.4-.5-.4-.2-1.2.4-1.3 1.1-.2 2.3-.2 3.4-.1z"/>
    <!-- Tail stock + fluke -->
    <path fill="#0b6e7a" d="M46.8 31.2c3.4-1 6.6-1 9.4.2.6.3.5 1.2-.2 1.4-2.2.6-4.2 1-6.2 2 2.6 1.2 5.4 1.4 8 .6.6-.2 1.1.6.6 1.1-3.2 2.2-7.2 2.8-11 1.4-1.2-.4-1.8-1.8-1.3-3 .2-.7.7-1.4 1.7-2z"/>
    <!-- Eye -->
    <circle cx="23.2" cy="33.4" r="1.5" fill="#f4f7f8"/>
  </g>
</svg>
